name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    uses: CCPBioSim/.github/.github/workflows/ci-docs.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
    with:
      build-dir: build
      timeout-minutes: 15

  pre-commit:
    name: Pre-commit
    uses: CCPBioSim/.github/.github/workflows/ci-pre-commit.yaml@f72e64d2dc791ad5ceda145777a3922895d92a5d # 0.17.0
    permissions:
      contents: read
    with:
      timeout-minutes: 15
