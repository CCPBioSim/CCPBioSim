# This repository only holds the documentation hub, so there is no Python
# package. The file is kept for the docs and pre-commit dependencies, so
# Renovate can keep them up to date.

[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpbiosim-docs"
version = "1.0.0"
description = "A central index of CCPBioSim documentation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://ccpbiosim.readthedocs.io/"
Repository = "https://github.com/CCPBioSim/CCPBioSim"

[project.optional-dependencies]
pre-commit = [
    "pre-commit>=4.5,<5.0",
]

docs = [
    "sphinx>=9.2,<9.3",
    "ccpbiosim-sphinx-theme>=1.3.4,<2.0",
    "myst-parser>=4.0,<6.0",
]

# No Python package to install.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
